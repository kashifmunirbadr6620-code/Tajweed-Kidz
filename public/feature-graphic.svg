<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)" />

  <!-- Decorative Islamic Arches / Geometry -->
  <circle cx="950" cy="50" r="180" fill="#ffffff" opacity="0.05" />
  <circle cx="80" cy="420" r="160" fill="#f59e0b" opacity="0.08" />

  <!-- Left Side: Cute Cartoon Qari Illustration -->
  <g transform="translate(140, 160) scale(1.8)">
    <!-- Robe -->
    <path d="M 25 118 C 30 85 45 78 60 78 C 75 78 90 85 95 118 Z" fill="#047857" stroke="#065f46" stroke-width="2.5" />
    <path d="M 48 78 L 60 95 L 72 78" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Neck & Head -->
    <rect x="52" y="65" width="16" height="18" rx="4" fill="#fed7aa" />
    <circle cx="60" cy="52" r="26" fill="#ffedd5" stroke="#fdba74" stroke-width="2" />
    <!-- Turban -->
    <path d="M 33 46 C 30 22 45 12 60 12 C 75 12 90 22 87 46 C 80 49 70 51 60 51 C 50 51 40 49 33 46 Z" fill="#10b981" stroke="#047857" stroke-width="2" />
    <circle cx="60" cy="22" r="5" fill="#f59e0b" />
    <!-- Eyes and smile -->
    <circle cx="51" cy="48" r="4.5" fill="#1e293b" />
    <circle cx="52.5" cy="46.5" r="1.8" fill="#ffffff" />
    <circle cx="69" cy="48" r="4.5" fill="#1e293b" />
    <circle cx="70.5" cy="46.5" r="1.8" fill="#ffffff" />
    <path d="M 54 57 Q 60 65 66 57" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Trimmed beard -->
    <path d="M 48 59 C 50 71 70 71 72 59 C 67 65 53 65 48 59 Z" fill="#451a03" />
  </g>

  <!-- Quran book in middle -->
  <g transform="translate(380, 240) scale(0.7)">
    <path d="M 100 330 C 180 320 240 335 256 350 C 272 335 332 320 412 330 L 412 210 C 332 200 272 215 256 230 C 240 215 180 200 100 210 Z" fill="#d97706" />
    <path d="M 110 320 C 180 310 235 325 252 340 L 252 220 C 235 205 180 190 110 200 Z" fill="#fffbeb" stroke="#fef3c7" stroke-width="4" />
    <path d="M 402 320 C 332 310 277 325 260 340 L 260 220 C 277 205 332 190 402 200 Z" fill="#fffdf5" stroke="#fef3c7" stroke-width="4" />
    <line x1="140" y1="240" x2="225" y2="240" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <line x1="287" y1="240" x2="372" y2="240" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Right Side / Typography -->
  <g transform="translate(520, 110)">
    <!-- Small Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#f59e0b" />
    <text x="110" y="24" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#451a03">
      ★ AGES 5-12 • SAFE &amp; AD-FREE ★
    </text>

    <!-- Urdu Title -->
    <text x="0" y="90" font-family="'Noto Nastaliq Urdu', 'Noto Naskh Arabic', serif" font-weight="bold" font-size="52" fill="#fef08a">
      تجوید کڈز
    </text>

    <!-- English Title -->
    <text x="0" y="145" font-family="'Fredoka', sans-serif" font-weight="900" font-size="44" fill="#ffffff">
      Tajweed Kids
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" font-family="sans-serif" font-weight="600" font-size="18" fill="#a7f3d0">
      بچوں کے لیے تجوید القرآن آسان اور مزیدار!
    </text>
    <text x="0" y="215" font-family="sans-serif" font-weight="500" font-size="15" fill="#e0e7ff">
      Makharij • Animated Mouth Map • Voice Checker • Fun Games
    </text>

    <!-- 3 Feature Badges -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="130" height="34" rx="12" fill="#ffffff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" />
      <text x="65" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">
        🗣️ مخارج نقشہ
      </text>

      <rect x="140" y="0" width="140" height="34" rx="12" fill="#ffffff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" />
      <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">
        🎙️ تلفظ چیکر
      </text>

      <rect x="290" y="0" width="140" height="34" rx="12" fill="#ffffff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" />
      <text x="360" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">
        🎮 تجوید گیمز
      </text>
    </g>
  </g>
</svg>
